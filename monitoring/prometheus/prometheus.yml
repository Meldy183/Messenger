global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: auth-service
    static_configs:
      - targets: [auth-service:8080]

  - job_name: chat-service
    static_configs:
      - targets: [chat-service:8081]

  - job_name: message-worker
    static_configs:
      - targets: [message-worker:8082]
