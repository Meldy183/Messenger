name: Go Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Go unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  http-tests:
    name: Run HTTP smoke tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start test environment
        run: docker compose up -d --build postgres kafka auth-service chat-service

      - name: Wait for services
        run: |
          set -euo pipefail

          wait_for() {
            local url="$1"
            local name="$2"
            for i in {1..90}; do
              if curl -fsS "$url" >/dev/null; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name ($url)"
            return 1
          }

          wait_for "http://localhost:8080/ready" "auth-service"
          wait_for "http://localhost:8081/ready" "chat-service"

      - name: Run HTTP tests
        env:
          AUTH_BASE_URL: http://localhost:8080
          CHAT_BASE_URL: http://localhost:8081
        run: go test -tags=integration ./tests/http -v

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color postgres kafka auth-service chat-service

      - name: Stop test environment
        if: always()
        run: docker compose down -v
