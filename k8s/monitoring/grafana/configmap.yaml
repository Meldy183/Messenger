apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: messenger
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        editable: false

  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: Messenger
        folder: Messenger
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards

  messenger.json: |
    {
      "__inputs": [],
      "__requires": [],
      "annotations": {"list": []},
      "description": "Messenger service metrics and logs",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(messenger_http_requests_total[5m])) by (service)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps"},
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi"}}
        },
        {
          "id": 2,
          "title": "HTTP Error Rate (%)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(messenger_http_requests_total{status=~\"5..\"}[5m])) by (service) / sum(rate(messenger_http_requests_total[5m])) by (service) * 100",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi"}}
        },
        {
          "id": 3,
          "title": "p95 Latency (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.95, sum(rate(messenger_http_request_duration_seconds_bucket[5m])) by (le, service))",
              "legendFormat": "p95 {{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "s"},
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi"}}
        },
        {
          "id": 4,
          "title": "p99 Latency (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.99, sum(rate(messenger_http_request_duration_seconds_bucket[5m])) by (le, service))",
              "legendFormat": "p99 {{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "s"},
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi"}}
        },
        {
          "id": 5,
          "title": "Active WS Connections",
          "type": "stat",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "messenger_ws_connections_active",
              "legendFormat": "connections",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 6,
          "title": "Messages Processed (msg/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 16},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(messenger_messages_processed_total[5m])) by (status)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "msgps"},
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi"}}
        },
        {
          "id": 7,
          "title": "Duplicate Message Rate (%)",
          "type": "stat",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 24},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(messenger_messages_processed_total{status=\"duplicate\"}[5m])) / sum(rate(messenger_messages_processed_total[5m])) * 100",
              "legendFormat": "duplicate %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"}
        },
        {
          "id": 8,
          "title": "Application Logs",
          "type": "logs",
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 24},
          "targets": [
            {
              "datasource": {"type": "loki", "uid": "loki"},
              "expr": "{job=\"kubernetes-pods\", namespace=\"messenger\", service=~\"auth-service|chat-service|message-worker|frontend\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["messenger"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Messenger Overview",
      "uid": "messenger-overview",
      "version": 1,
      "weekStart": ""
    }
