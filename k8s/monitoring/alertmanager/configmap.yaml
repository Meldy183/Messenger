apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: messenger
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # Dev/local setup: alerts are visible in Alertmanager UI only.
    # No external receiver backend is configured by default.
    route:
      receiver: default
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h

    receivers:
      - name: default
