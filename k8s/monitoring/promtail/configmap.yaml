apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: messenger
data:
  promtail-k8s.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.messenger.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: messenger-app
        pipeline_stages:
          - cri: {}
          - match:
              selector: '{namespace="messenger",service=~"auth-service|chat-service|message-worker|frontend"}'
              stages:
                - json:
                    expressions:
                      level: level
                      msg: msg
                      caller: caller
                - labels:
                    level:
                - output:
                    source: msg

        static_configs:
          - targets: [localhost]
            labels:
              job: messenger-app
              namespace: messenger
              service: auth-service
              __path__: /var/log/pods/messenger_auth-service-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-app
              namespace: messenger
              service: chat-service
              __path__: /var/log/pods/messenger_chat-service-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-app
              namespace: messenger
              service: message-worker
              __path__: /var/log/pods/messenger_message-worker-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-app
              namespace: messenger
              service: frontend
              __path__: /var/log/pods/messenger_frontend-*/*/*.log

      - job_name: messenger-infra
        pipeline_stages:
          - cri: {}

        static_configs:
          - targets: [localhost]
            labels:
              job: messenger-infra
              namespace: messenger
              service: postgres
              __path__: /var/log/pods/messenger_postgres-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-infra
              namespace: messenger
              service: kafka
              __path__: /var/log/pods/messenger_kafka-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-infra
              namespace: messenger
              service: zookeeper
              __path__: /var/log/pods/messenger_zookeeper-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-infra
              namespace: messenger
              service: prometheus
              __path__: /var/log/pods/messenger_prometheus-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-infra
              namespace: messenger
              service: loki
              __path__: /var/log/pods/messenger_loki-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-infra
              namespace: messenger
              service: grafana
              __path__: /var/log/pods/messenger_grafana-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-infra
              namespace: messenger
              service: alertmanager
              __path__: /var/log/pods/messenger_alertmanager-*/*/*.log

          - targets: [localhost]
            labels:
              job: messenger-infra
              namespace: messenger
              service: promtail
              __path__: /var/log/pods/messenger_promtail-*/*/*.log