apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: messenger
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      - job_name: auth-service
        static_configs:
          - targets: [auth-service:8080]

      - job_name: chat-service
        static_configs:
          - targets: [chat-service:8081]

      - job_name: message-worker
        static_configs:
          - targets: [message-worker:8082]

  alert-rules.yml: |
    groups:
      - name: messenger.rules
        rules:
          - alert: HighHTTPErrorRate
            expr: >
              sum(rate(messenger_http_requests_total{status=~"5.."}[5m])) by (service)
              /
              sum(rate(messenger_http_requests_total[5m])) by (service)
              > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High HTTP error rate on {{ $labels.service }}"
              description: "Service {{ $labels.service }} has error rate {{ $value | humanizePercentage }} over the last 5 minutes."
